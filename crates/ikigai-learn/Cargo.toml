[package]
name = "ikigai-learn"
description = "Self-paced courses as ikigai resources: units, questions, exercises and checks under urn:learn:, a learner's work as a ledger, and progress as a composition."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["ikigai", "roc", "learning", "courses", "rdf"]
categories = ["wasm"]

[dependencies]
# The released kernel, on the ecosystem's current line: core 0.5 is the line ikigai-fs 0.7.0,
# ikigai-vocab 0.5 and ikigai-conformance 0.16.0 are on, so a test host links exactly one
# `ikigai-core`.
ikigai-core = "0.5.0"
# Reading the stored Turtle atoms back. Both are wasm-clean; in the browser oxrdf's `rand`
# needs getrandom's JS backend (below), as in ikigai-core's `declare` feature.
oxrdf = "0.3"
oxttl = "0.2"
# An expiry's xsd:dateTime: parsing, printing and the calendar, from oxrdf's own XSD datatypes
# crate (the version oxrdf 0.3.5 pins) rather than a private copy. Wasm-clean: its only
# dependency is thiserror (js-sys only behind its optional `js` feature, which this crate does not enable).
oxsdatatypes = "0.2.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Since getrandom 0.3.4 the `wasm_js` feature alone selects the browser backend: no rustflags.
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[dev-dependencies]
# The test host: ikigai-fs `cacheable_space` over a scratch state root, `ikigai-vocab`'s Meta
# face, and the module recipe (`ikigai-conformance`) as one test. The crate itself links none
# of them: it reaches the state root through the kernel by name.
futures = "0.3"
ikigai-conformance = "0.16.0"
ikigai-fs = "0.7.0"
ikigai-vocab = "0.5.0"
