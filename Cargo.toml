[workspace]
resolver = "2"
# One crate today. A host-facing or check-runner crate joins beside it under crates/ when the
# design calls for one.
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-learn"
